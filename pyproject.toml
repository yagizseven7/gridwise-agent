[project]
name = "gridwise-agent"
version = "0.3.0"
description = "A LangGraph multi-agent assistant for energy analytics: RAG, SQL, summarisation, verification, guardrails, evals and human-approved email replies."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-openai>=1.0,<2",
]

[project.optional-dependencies]
azure-entra = ["azure-identity>=1.17"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
